name: daily-signal

on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = 매일 06:30 KST
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 파이프라인 실행
        run: python pipeline.py
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}   # 비워두면 공급자별 기본 모델을 씀
          TOP_N: ${{ vars.TOP_N }}           # 비워두면 10
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: 결과 커밋
        run: |
          git config user.name "tech-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date +%F) 브리핑"
          git pull --rebase
          git push
